<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Smart Locker Delivery</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        iframe {
            border: none;
            width: 100%;
            min-height: 1100px;
            /* Note: The height is no longer fixed here, it's set by JS */
        }
        .step-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #1f2937;
            font-weight: 600;
        }
        .step-header .step-number {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 2rem;
            height: 2rem;
            background-color: #d1d5db;
            color: #6b7280;
            border-radius: 9999px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="bg-white shadow-sm p-4 text-center text-lg font-semibold">
        Secure Checkout
    </div>

    <div class="container mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Main Checkout Content -->
        <div class="col-span-1 lg:col-span-2 space-y-8">
            
            <!-- Payment Method Section -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="step-header mb-4">
                    <span class="step-number bg-green-500 text-white">1</span>
                    <h2 class="text-xl">Payment Method</h2>
                </div>
                <div class="space-y-4">
                    <label class="flex items-center space-x-3 bg-gray-50 p-4 rounded-lg cursor-pointer transition hover:bg-gray-100">
                        <input type="radio" name="payment_method" value="credit_card" class="form-radio text-green-600">
                        <i class="fab fa-cc-visa text-2xl text-blue-800"></i>
                        <span>Credit/Debit Card</span>
                    </label>
                    <label class="flex items-center space-x-3 bg-gray-50 p-4 rounded-lg cursor-pointer transition hover:bg-gray-100">
                        <input type="radio" name="payment_method" value="paypal" class="form-radio text-green-600">
                        <i class="fab fa-paypal text-2xl text-blue-600"></i>
                        <span>PayPal</span>
                    </label>
                    <label class="flex items-center space-x-3 bg-gray-50 p-4 rounded-lg cursor-pointer transition hover:bg-gray-100">
                        <input type="radio" name="payment_method" value="google_pay" class="form-radio text-green-600">
                        <i class="fab fa-google-pay text-2xl text-gray-700"></i>
                        <span>Google Pay</span>
                    </label>
                </div>
            </div>

            <!-- Delivery Details Section -->
            <div class="bg-white p-6 rounded-lg shadow-md">
                <div class="step-header mb-4">
                    <span class="step-number">2</span>
                    <h2 class="text-xl">Delivery Details</h2>
                </div>
                
                <div class="space-y-4">
                    <div class="flex items-center space-x-3 bg-green-50 p-4 rounded-lg border border-green-300">
                        <i class="fas fa-box-open text-green-600 text-xl"></i>
                        <span class="text-green-800">Smart Locker Delivery Selected</span>
                    </div>

                    <!-- Embedded Locker Selector -->
                    <div class="border border-gray-200 rounded-lg overflow-hidden">
                        <iframe src="index.html" id="lockerSelectorFrame"></iframe>
                    </div>

                    <!-- Display Selected Locker Info -->
                    <div id="selectedLockerInfo" class="p-4 bg-yellow-50 text-yellow-800 rounded-lg hidden">
                        <i class="fas fa-check-circle text-green-600 mr-2"></i>
                        <span class="font-semibold">Locker selected:</span> <span id="lockerIdDisplay"></span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Order Summary Sidebar -->
        <div class="col-span-1">
            <div class="bg-white p-6 rounded-lg shadow-md sticky top-4">
                <h2 class="text-xl font-bold mb-4">Order Summary</h2>
                <ul class="text-gray-600 space-y-2">
                    <li class="flex justify-between"><span>Subtotal:</span><span>$50.00</span></li>
                    <li class="flex justify-between"><span>Shipping:</span><span>$0.00</span></li>
                    <li class="flex justify-between"><span>Tax:</span><span>$4.00</span></li>
                    <li class="flex justify-between font-bold text-gray-800 border-t pt-2 mt-2"><span>Total:</span><span>$54.00</span></li>
                </ul>
                <button class="w-full mt-6 bg-green-500 text-white font-bold py-3 rounded-lg shadow-lg hover:bg-green-600 transition disabled:bg-gray-400" id="placeOrderButton" disabled>
                    Place Order
                </button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const placeOrderButton = document.getElementById('placeOrderButton');
            const lockerIdDisplay = document.getElementById('lockerIdDisplay');
            const selectedLockerInfo = document.getElementById('selectedLockerInfo');
            const lockerSelectorFrame = document.getElementById('lockerSelectorFrame');

            let selectedLockerId = null;

            window.addEventListener('message', (event) => {
                if (event.origin !== window.location.origin) {
                    return;
                }
                
                // Handle the locker selection message
                if (event.data && event.data.type === 'lockerSelected' && event.data.lockerId) {
                    selectedLockerId = event.data.lockerId;
                    console.log("Received selected locker ID:", selectedLockerId);
                    
                    lockerIdDisplay.textContent = selectedLockerId;
                    selectedLockerInfo.classList.remove('hidden');
                    
                    placeOrderButton.disabled = false;
                }

                // Handle the iframe resize message
                if (event.data && event.data.type === 'resizeIframe' && event.data.height) {
                    lockerSelectorFrame.style.height = `${event.data.height}px`;
                }
            });

            placeOrderButton.addEventListener('click', () => {
                if (selectedLockerId) {
                    alert(`Order placed for delivery to locker ID: ${selectedLockerId}`);
                } else {
                    alert("Please select a locker first.");
                }
            });
        });
    </script>
</body>
</html>
